name: SpendLens Monitor

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r eval/requirements.txt
      - name: Full eval
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: python eval/run_eval.py
      - name: Compare with baseline
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          TOLERANCE = 0.03
          baseline = json.loads(Path("eval/baseline.json").read_text())
          results_path = Path("eval/results.json")
          if not results_path.exists():
              print("No eval/results.json (no labelled receipts or no API key): nothing to compare.")
              sys.exit(0)
          results = json.loads(results_path.read_text())
          metrics = {k: v for k, v in baseline.items() if isinstance(v, (int, float))}
          if not metrics:
              print("eval/baseline.json has no metrics yet: copy them from eval/results.json once labels exist.")
              sys.exit(0)
          drops = {k: (v, results.get(k, 0.0)) for k, v in metrics.items() if results.get(k, 0.0) < v - TOLERANCE}
          print("baseline:", metrics)
          print("current: ", {k: results.get(k) for k in metrics})
          if drops:
              print(f"Drift beyond {TOLERANCE}:", drops)
              sys.exit(1)
          print(f"No metric dropped more than {TOLERANCE} below baseline.")
          PY
