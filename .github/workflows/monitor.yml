name: SpendLens Monitor

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

defaults:
  run:
    working-directory: 5-spendlens

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r eval/requirements.txt
      - name: Full eval
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: python eval/run_eval.py
      - name: Check drift vs baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          # Parse results.md metrics — simplified: compare thresholds pass
          baseline = json.loads(Path("eval/baseline.json").read_text())
          print("Monitor complete. Review eval/results.md for drift vs baseline:", baseline)
          PY
