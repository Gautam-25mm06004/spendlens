name: SpendLens Eval

on:
  pull_request:
    paths:
      - "5-spendlens/**"
  push:
    branches: [main]
    paths:
      - "5-spendlens/**"

defaults:
  run:
    working-directory: 5-spendlens

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 5-spendlens/package-lock.json
      - run: npm ci
      - run: npm test

  extraction-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r eval/requirements.txt
      - name: Run eval (limited on PR)
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: python eval/run_eval.py --limit 5
